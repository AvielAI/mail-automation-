<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Automation{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Job Automation</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/blocked" class="nav-link">Blocked</a>
            <a href="/sent" class="nav-link">Sent</a>
            <a href="/api/export/excel" class="nav-link btn-export">Export Excel</a>
            <a href="/api/export/word" class="nav-link btn-export">Export Word</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
